server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent caching index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve all requests from root, SPA routing handles paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
